# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Scale up to handle concurrent users; 1 handles ~80 concurrent requests
  maxInstances: 3
  minInstances: 0
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Firebase Web SDK — public by design: these ship inside the client JS bundle,
  # so they are plain values, not Secret Manager secrets. Access is controlled by
  # Firestore/Storage security rules, not by hiding these keys.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCT81UBSC9sz3F8awSN14xyLWGs_VreOrc
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: japantravelplanners-d2992.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: japantravelplanners-d2992
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: japantravelplanners-d2992.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "74401408081"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:74401408081:web:b800d86167f5962ac3c470"
    availability: [BUILD, RUNTIME]
  # Google Maps Places API (New) — genuine server-side secret, stored in Secret
  # Manager (not plaintext). Runtime only; the link-preview route reads it per request.
  - variable: GOOGLE_MAPS_API_KEY
    secret: GOOGLE_MAPS_API_KEY
    availability: [RUNTIME]
