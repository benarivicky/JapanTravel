# JapanTravel app — LOCAL DEVELOPMENT ONLY.
#
# The public site (japantravel.amitkuzi.com) is no longer served from this
# container: it was removed from the central Caddy proxy. Production deploys
# come from the GitHub prod branch via Firebase App Hosting (see DEPLOY.md).
#
# The app publishes NO host ports — if you re-attach it to the shared Caddy
# network it is reachable internally as http://japantravel-app:3000.
#
#   Start / update:  docker compose up -d --build
#   Logs:            docker compose logs -f app
#   Stop:            docker compose down
#
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: japantravel-app
    container_name: japantravel-app
    restart: unless-stopped
    env_file:
      - .env.local
    expose:
      - "3000"
    # Hardening: block privilege escalation, drop all Linux capabilities, and
    # make the root filesystem read-only. The app only needs writable temp/cache,
    # provided as small in-memory tmpfs mounts (noexec stops dropped binaries
    # from being run — this is what let the XMRig miner execute from /var/tmp).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/tmp:rw,noexec,nosuid,size=16m
      - /app/.next/cache:rw,noexec,nosuid,size=256m
    networks:
      - caddy

networks:
  # Join the existing proxy's network instead of creating a new one.
  caddy:
    name: caddy-setup_default
    external: true
