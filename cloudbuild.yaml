# GCP Cloud Build pipeline for JapanTravel (gcpV3+)
# Triggered on push to: gcpV3, master
# Requires Cloud Build service account with:
#   - roles/firebase.admin  (or roles/firebaseapphosting.admin)
#   - roles/secretmanager.secretAccessor
#
# One-time setup: see DEPLOY.md

steps:
  # ── Step 1: Install dependencies ─────────────────────────────────────────
  - name: "node:20"
    id: install
    entrypoint: npm
    args: ["ci", "--prefer-offline"]
    env:
      - "npm_config_cache=/workspace/.npm"

  # ── Step 2: Type-check ────────────────────────────────────────────────────
  - name: "node:20"
    id: typecheck
    entrypoint: npm
    args: ["run", "typecheck"]
    waitFor: ["install"]

  # ── Step 3: Lint ──────────────────────────────────────────────────────────
  - name: "node:20"
    id: lint
    entrypoint: npm
    args: ["run", "lint"]
    waitFor: ["install"]

  # ── Step 4: Unit tests ────────────────────────────────────────────────────
  - name: "node:20"
    id: test
    entrypoint: npm
    args: ["run", "test", "--", "--ci", "--no-coverage"]
    waitFor: ["install"]
    env:
      # Jest needs these at test time (values come from Secret Manager substitutions)
      - "NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}"
      - "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}"
      - "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}"
      - "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}"
      - "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}"
      - "NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}"
      - "GOOGLE_AI_API_KEY=${_GOOGLE_AI_API_KEY}"

  # ── Step 5: Production build ──────────────────────────────────────────────
  - name: "node:20"
    id: build
    entrypoint: npm
    args: ["run", "build"]
    waitFor: ["typecheck", "lint", "test"]
    env:
      - "NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}"
      - "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}"
      - "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}"
      - "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}"
      - "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}"
      - "NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}"
      - "GOOGLE_AI_API_KEY=${_GOOGLE_AI_API_KEY}"

  # ── Step 6: Deploy to Firebase App Hosting ────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: deploy
    entrypoint: bash
    args:
      - "-c"
      - |
        npm install -g firebase-tools && \
        firebase deploy --only apphosting \
          --project japantravelplanners-d2992 \
          --non-interactive \
          --force
    waitFor: ["build"]

# Substitution defaults — override these in the Cloud Build trigger settings
# by mapping each _VAR to a Secret Manager secret.
substitutions:
  _FIREBASE_API_KEY: ""
  _FIREBASE_AUTH_DOMAIN: ""
  _FIREBASE_PROJECT_ID: ""
  _FIREBASE_STORAGE_BUCKET: ""
  _FIREBASE_MESSAGING_SENDER_ID: ""
  _FIREBASE_APP_ID: ""
  _GOOGLE_AI_API_KEY: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: "1200s"
